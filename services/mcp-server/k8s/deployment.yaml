# Placeholders (${...}) are substituted by scripts/render-k8s.sh at deploy time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: ${K8S_NAMESPACE}
  labels:
    app: mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT_NAME}
      containers:
        - name: mcp-server
          image: ${ECR_REGISTRY}/${ECR_REPO_MCP}:${IMAGE_TAG}
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: COGNITO_USER_POOL_ID
              value: "${COGNITO_USER_POOL_ID}"
            - name: COGNITO_APP_CLIENT_ID
              value: "${COGNITO_RESOURCE_CLIENT_ID}"
            # JWT validation runs at the API Gateway layer; the service trusts
            # requests arriving via the VPC Link. Set AUTH_DISABLED=false in
            # config.env to also enforce Cognito JWT in-pod (defense in depth).
            - name: AUTH_DISABLED
              value: "${AUTH_DISABLED}"
            # DNS rebinding protection (mcp >= 1.23, GHSA-9h52-p55h-vw2f). The
            # SDK validates the Host header against an explicit allow-list; it
            # supports exact hosts and the "host:*" any-port form, but NOT
            # domain wildcards - so deploy.sh fills in this service's real
            # front-door hostnames (API Gateway execute-api + internal ALB,
            # since either layer may be the one setting Host on the hop to the
            # pod). Empty on the first apply (the API does not exist yet);
            # deploy.sh re-renders this Deployment once it does.
            - name: MCP_DNS_REBINDING_PROTECTION
              value: "${MCP_DNS_REBINDING_PROTECTION}"
            - name: MCP_ALLOWED_HOSTS
              value: "${MCP_ALLOWED_HOSTS}"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
