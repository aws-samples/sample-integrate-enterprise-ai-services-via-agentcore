apiVersion: v1
kind: Service
metadata:
  name: claude-agent
  namespace: ${K8S_NAMESPACE}
  labels:
    app: claude-agent
spec:
  type: ClusterIP
  selector:
    app: claude-agent
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
---
# Dedicated INTERNAL ALB for this service. One Ingress per service keeps each
# gateway target endpoint a clean base URL (no path rewriting).
#
# TLS is handled one layer up by Amazon API Gateway (execute-api endpoint with
# an AWS-managed certificate). API Gateway reaches this ALB privately over a
# VPC Link, so the ALB is internal and serves plain HTTP(80) - no ACM cert and
# no public exposure. The fixed load-balancer-name lets setup-apigateway.py
# resolve this ALB's HTTP listener ARN at deploy time.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claude-agent
  namespace: ${K8S_NAMESPACE}
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: ${PROJECT_SHORT}-claude
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claude-agent
                port:
                  number: 80
