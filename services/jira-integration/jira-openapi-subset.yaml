openapi: 3.0.3
info:
  title: Jira Cloud REST API (subset)
  version: "3"
  description: >
    A minimal subset of the Jira Cloud Platform REST API v3, used as the schema
    for the AgentCore Gateway HTTP passthrough target. Only the operations the
    demo exercises are included: search issues, get an issue, and create an
    issue. Authentication is HTTP Basic (email + API token), supplied by the
    gateway's API-key credential provider.
servers:
  - url: https://your-domain.atlassian.net/rest/api/3
    description: Replace with your Atlassian site base URL.
security:
  - basicAuth: []
paths:
  /search/jql:
    get:
      operationId: searchIssues
      summary: Search issues using JQL
      description: >
        Search Jira issues. Uses the current Jira Cloud search endpoint
        (/rest/api/3/search/jql); the legacy /rest/api/3/search was removed by
        Atlassian (returns 410). IMPORTANT: unbounded JQL is rejected - the JQL
        MUST include a restriction such as a project or a date bound. Prefer
        scoping to the demo project, e.g.
        "project = ACGW ORDER BY created DESC".
      parameters:
        - name: jql
          in: query
          required: true
          description: >
            Bounded JQL query string, e.g.
            "project = ACGW ORDER BY created DESC".
          schema:
            type: string
        - name: maxResults
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: fields
          in: query
          required: false
          description: Comma separated list of fields to return, e.g. "summary,status".
          schema:
            type: string
            default: "summary,status"
      responses:
        "200":
          description: Matching issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /issue/{issueIdOrKey}:
    get:
      operationId: getIssue
      summary: Get a single issue by id or key
      parameters:
        - name: issueIdOrKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
  /issue:
    post:
      operationId: createIssue
      summary: Create an issue
      description: >
        Create a Jira issue. Use the demo software project (project key "ACGW")
        unless the user names another, and a valid issue type for it such as
        "Task", "Story", or "Bug". Do NOT use a discovery project (its only
        issue type is "Idea"), or the request fails with an HTTP 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedIssue"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    SearchResults:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        nextPageToken:
          type: string
          description: Token to fetch the next page, absent on the last page.
        isLast:
          type: boolean
          description: True when there are no more pages.
    Issue:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        fields:
          type: object
          properties:
            summary:
              type: string
            status:
              type: object
              properties:
                name:
                  type: string
    CreateIssueRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: object
          required: [project, summary, issuetype]
          properties:
            project:
              type: object
              properties:
                key:
                  type: string
            summary:
              type: string
            description:
              type: string
            issuetype:
              type: object
              properties:
                name:
                  type: string
    CreatedIssue:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        self:
          type: string
