# =============================================================================
# gateway-config.yaml - declarative description of the AgentCore Gateway and its
# four targets. setup-gateway.py reads this file, resolves the ${...} values
# from deploy-outputs.env (written by deploy.sh) plus config.env, and calls the
# bedrock-agentcore-control APIs.
#
# Anything of the form ${VAR} is substituted from the environment at runtime, so
# no endpoint, ARN, or client id is hard-coded here.
# =============================================================================

gateway:
  name: "${GATEWAY_NAME}"
  description: "Demo gateway aggregating 4 enterprise AI services"
  protocol: MCP
  mcp_supported_versions:
    - "${GATEWAY_MCP_VERSION}"
  search_type: "${GATEWAY_SEARCH_TYPE}"        # SEMANTIC or empty
  # Inbound auth: JWT issued by the demo Cognito user pool. The MCP client
  # (Amazon Quick / Kiro) presents a token minted by the gateway app client.
  inbound_auth:
    type: CUSTOM_JWT
    discovery_url: "${COGNITO_DISCOVERY_URL}"
    allowed_clients:
      - "${COGNITO_GATEWAY_CLIENT_ID}"

# Outbound credential providers stored in the AgentCore Identity token vault.
credential_providers:
  # Used by Targets 1/2/3 to authenticate to the self-hosted services.
  cognito_oauth:
    name: "${PROJECT_NAME}-cognito-oauth"
    type: OAUTH
    vendor: CustomOauth2
    discovery_url: "${COGNITO_DISCOVERY_URL}"
    client_id: "${COGNITO_SERVICE_CLIENT_ID}"
    # client_secret is read from the environment (COGNITO_SERVICE_CLIENT_SECRET),
    # never written to this file.
    scopes:
      - "${COGNITO_SCOPE}"
  # Used by Target 4 to authenticate to Jira Cloud with Basic auth.
  jira_api_key:
    name: "${PROJECT_NAME}-jira-apikey"
    type: API_KEY
    # api key value is read from Secrets Manager / environment at runtime.

targets:
  - name: langgraph-agent
    kind: openapi                     # OpenAPI -> MCP, schema uploaded to S3
    openapi_s3_uri: "${LANGGRAPH_OPENAPI_S3_URI}"
    outbound: cognito_oauth

  - name: claude-agent
    kind: openapi                     # OpenAPI -> MCP, schema uploaded to S3
    openapi_s3_uri: "${CLAUDE_OPENAPI_S3_URI}"
    outbound: cognito_oauth

  - name: mcp-server
    kind: mcp_server                  # native MCP server target
    endpoint: "${MCP_ENDPOINT}"
    outbound: cognito_oauth

  - name: jira-cloud
    kind: openapi                     # OpenAPI -> MCP, schema uploaded to S3
    openapi_s3_uri: "${JIRA_OPENAPI_S3_URI}"
    outbound: jira_api_key
    # Jira Basic auth: base64(email:api_token) in the Authorization header.
    api_key_location: HEADER
    api_key_parameter_name: Authorization
    api_key_prefix: "Basic "
